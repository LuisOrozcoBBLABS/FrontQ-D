<div class="page">
  <div class="page__head enter">
    <p class="eyebrow">Nuevo proyecto</p>
    <h1 class="page__title">Registrar una idea de innovación</h1>
    <p class="page__sub">Describe la propuesta. Quedá registrada para el área y podés asignarla a alguien del equipo.</p>
  </div>

  <div class="card enter" style="max-width:760px">
    <app-project-fields [(valor)]="borrador" [deshabilitado]="guardando()" />

    @if (error()) { <p class="login__error" style="margin-bottom:16px">{{ error() }}</p> }

    <div class="modal__foot" style="border-top:none;padding-top:0;margin-top:8px">
      @if (!puedeCrear()) {
        <p class="field__hint" style="margin-right:auto">
          No tenés el permiso para crear proyectos. Pedile a un administrador el permiso
          <b>projects.create</b>.
        </p>
      }
      <button class="btn btn--ghost" type="button" (click)="cancel()">Cancelar</button>
      <button class="btn btn--primary" type="button" [disabled]="!puedeGuardar()" (click)="save()">
        {{ guardando() ? 'Guardando…' : 'Guardar proyecto' }}
      </button>
    </div>
  </div>
</div>
