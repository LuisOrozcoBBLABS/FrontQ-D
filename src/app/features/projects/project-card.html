<button
  class="tarjeta"
  type="button"
  [class.tarjeta--sel]="seleccionada()"
  [class.tarjeta--fija]="!movible()"
  [class]="'tarjeta tarjeta--' + alerta()"
  [attr.aria-current]="seleccionada() ? 'true' : null"
  [attr.aria-roledescription]="movible() ? 'tarjeta movible' : null"
  [attr.aria-describedby]="movible() ? 'kb-ayuda-tablero' : null"
  [title]="titulo()"
  (click)="abrir.emit(proyecto())"
  (keydown)="tecla($event)"
>
  <span class="tarjeta__top">
    @if (prioridadLabel(); as pr) {
      <span class="prio-pin" [class]="'prio-pin prio-pin--' + prioridad()">{{ pr }}</span>
    } @else {
      <span class="tarjeta__sector">{{ proyecto().sector }}</span>
    }

    @if (movible()) {
      <span class="tarjeta__asa" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>
      </span>
    } @else {
      <span class="tarjeta__asa tarjeta__asa--no" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </span>
    }
  </span>

  <span class="tarjeta__nombre">{{ proyecto().nombre }}</span>

  <span class="tarjeta__pie">
    @if (responsable(); as r) {
      <span class="tarjeta__persona">
        <span class="tarjeta__ini" aria-hidden="true">{{ iniciales(r) }}</span>
        <span class="tarjeta__nom">{{ r }}</span>
        @if (otros() > 0) { <span class="tarjeta__mas">+{{ otros() }}</span> }
      </span>
    } @else {
      <span class="tarjeta__persona text-dim">Sin responsable</span>
    }
  </span>

  <span class="tarjeta__tiempos">
    <span class="tiempo" [class.tiempo--alerta]="alerta() !== 'normal'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2"/></svg>
      <span class="mono">{{ corto(diasEtapa()) }}</span>
      <span class="tiempo__que">en etapa</span>
    </span>

    <span class="tiempo tiempo--total">
      <span class="mono">{{ corto(diasTotal()) }}</span>
      <span class="tiempo__que">total</span>
    </span>

    @if (inicio(); as d) {
      <span class="tarjeta__inicio">desde {{ d }}</span>
    }
  </span>

  @if (motivo(); as m) {
    <span class="tarjeta__aviso" [title]="m">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9.5"/></svg>
      <span class="sr-only">{{ m }}</span>
    </span>
  }
</button>
