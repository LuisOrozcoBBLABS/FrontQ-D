<div class="login">
  <div class="login__top"><app-theme-toggle /></div>

  <div class="login__card card enter" style="width:min(100%,520px)">
    <p class="eyebrow">Primer ingreso</p>
    <h1 class="login__title display">Bienvenido{{ nombre ? ', ' + nombre : '' }}</h1>
    <p class="text-2 login__sub">Antes de empezar, completa estos datos. Puedes editarlos luego desde tu perfil.</p>

    <div class="field">
      <label for="fn">Fecha de nacimiento</label>
      <p-datepicker
        inputId="fn"
        [ngModel]="fechaComoDato()"
        (ngModelChange)="fijarFecha($event)"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        [maxDate]="hoy"
        [fluid]="true"
        placeholder="dd/mm/aaaa"
      />
    </div>

    <div class="field">
      <label>Género</label>
      <p-selectbutton
        [options]="generos"
        [ngModel]="genero()"
        (ngModelChange)="genero.set($event)"
        optionLabel="label"
        optionValue="value"
        [multiple]="false"
        styleClass="genero-opciones"
      />
    </div>

    @if (error()) { <p class="login__error">{{ error() }}</p> }

    <p-button label="Continuar" icon="pi pi-arrow-right" iconPos="right" styleClass="login__submit"
              [fluid]="true" (onClick)="finish()" />

    <div class="sim-note login__sim">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>Manejamos siempre la inclusión: la opción “Prefiero no decirlo” es totalmente válida.</span>
    </div>
  </div>
</div>
