<div class="acceso">
  <div class="marca-fondo" aria-hidden="true">
    <span class="marca-fondo__txt">R&amp;D</span>
  </div>

  <button
    class="acceso__tema"
    type="button"
    (click)="toggleTema()"
    [attr.aria-label]="esOscuro() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
  >
    @if (esOscuro()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4"/><path d="M12 19.6V22"/><path d="M2 12h2.4"/><path d="M19.6 12H22"/><path d="m4.9 4.9 1.7 1.7"/><path d="m17.4 17.4 1.7 1.7"/><path d="m19.1 4.9-1.7 1.7"/><path d="m6.6 17.4-1.7 1.7"/></svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
    }
  </button>

  <main class="acceso__col acceso__col--ancho">
    <img class="logo-bb logo-bb--acceso logo-bb--oscuro" src="brand/logo-blanco.png"
         alt="Blackbird Labs" width="1585" height="540" />
    <img class="logo-bb logo-bb--acceso logo-bb--claro" src="brand/logo-negro.png"
         alt="Blackbird Labs" width="1585" height="540" />

    <h1 class="acceso__t">Bienvenido{{ nombre ? ', ' + nombre : '' }}</h1>
    <p class="acceso__sub">Dos datos y entrás. Los podés cambiar después desde tu perfil.</p>

    <!-- <form> de verdad: sin él, Enter dentro del calendario no envía, que es
         lo que cualquiera espera de un formulario de dos campos. -->
    <form class="acceso__form" (ngSubmit)="finish()">
      <div class="campo">
        <label class="campo__l" for="fn">Fecha de nacimiento</label>
        <p-datepicker
          inputId="fn"
          [ngModel]="fechaComoDato()"
          (ngModelChange)="fijarFecha($event)"
          [ngModelOptions]="{ standalone: true }"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          [maxDate]="hoy"
          [fluid]="true"
          placeholder="dd/mm/aaaa"
        />
      </div>

      <!-- role="group" + aria-labelledby, no una <label> suelta: una etiqueta
           sin `for` y sin control envuelto no se asocia a nada, así que el
           grupo de opciones se anunciaba sin nombre. -->
      <div class="campo" role="group" aria-labelledby="lbl-genero">
        <span class="campo__l" id="lbl-genero">Género</span>
        <p-selectbutton
          [options]="generos"
          [ngModel]="genero()"
          (ngModelChange)="genero.set($event)"
          [ngModelOptions]="{ standalone: true }"
          optionLabel="label"
          optionValue="value"
          [multiple]="false"
          [allowEmpty]="false"
          ariaLabelledBy="lbl-genero"
        />
      </div>

      @if (error(); as e) {
        <p class="acceso__error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5"/><path d="M12 16.5h.01"/></svg>
          <span>{{ e }}</span>
        </p>
      }

      <p-button
        type="submit"
        label="Continuar"
        icon="pi pi-arrow-right"
        iconPos="right"
        styleClass="acceso__enviar"
        [fluid]="true"
      />
    </form>

    <p class="onb__nota">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>«Prefiero no decirlo» es una respuesta completa. No se usa para nada más que saludarte bien.</span>
    </p>
  </main>
</div>
