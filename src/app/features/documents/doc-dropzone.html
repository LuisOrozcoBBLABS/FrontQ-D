<label
  class="dz"
  [class.dz--sobre]="sobre()"
  [class.dz--error]="error()"
  [class.dz--off]="deshabilitado()"
  (dragover)="alPasarSobre($event)"
  (dragleave)="alSalir()"
  (drop)="alSoltar($event)">
  <input
    class="sr-only"
    type="file"
    [accept]="extensiones"
    [disabled]="deshabilitado()"
    aria-describedby="dz-hint"
    (change)="alElegir($event)" />

  <span class="dz__icono" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6"/>
      <path d="M12 18v-6"/>
      <path d="m9 15 3-3 3 3"/>
    </svg>
  </span>

  <span class="dz__titulo">
    <span class="dz__arrastra">Arrastrá el documento acá, o </span>elegí un archivo
  </span>
  <span class="dz__hint" id="dz-hint">PDF o DOCX, hasta 8 MB. No se guarda en el servidor.</span>
</label>

@if (error()) {
  <p class="login__error dz__msg" role="alert">{{ error() }}</p>
}
