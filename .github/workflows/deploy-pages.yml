name: Desplegar front en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para que deploy-pages pueda publicar con OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si entra uno nuevo, el anterior se cancela.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-fund --no-audit

      - name: Pruebas unitarias
        run: npx ng test --watch=false

      # El sitio vive en /FrontQ-D/, no en la raíz del dominio: sin base-href
      # el navegador pide los bundles a github.io/ y todo da 404.
      - name: Compilar en modo producción
        run: npm run build -- --configuration production --base-href /FrontQ-D/

      # GitHub Pages no reescribe rutas: sirve 404.html cuando no encuentra el
      # archivo. Con una copia de index.html ahí, las rutas del router
      # (/login, /proyectos) cargan la aplicación en vez de la página de error.
      - name: Preparar el artefacto para un SPA
        run: |
          cp dist/web/browser/index.html dist/web/browser/404.html
          touch dist/web/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web/browser

  desplegar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
